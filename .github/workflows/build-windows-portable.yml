name: Build Windows Portable

# WeKnora Lite — Windows 便携版构建
# 参考上游 release-lite.yml 结构，但产物为便携目录而非 NSIS 安装包。
# 核心差异：
#   - wails build 自动处理 desktop+production 标签、图标、资源
#   - 产物 = WeKnora-Lite.exe + web/ + config/ + migrations/ + jieba-dict/
#     + duckdb 扩展捆绑 + Start-Portable.bat 启动器
#   - 扩展从 extensions.duckdb.org 下载（gzip 格式），离线可用

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到哪个 Release 标签（留空 = portable-latest，每次覆盖同一个 Release）'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*.*.*']

# 发布是滚动的：两个 run 同时写同一个 Release 会互相踩（delete-asset 与 upload
# 交错，可能留下半新半旧的一套资产），所以按固定 group 串行化。不取消进行中的
# run —— 半途取消可能正好停在「已删旧资产、还没传新资产」的中间态。
concurrency:
  group: portable-release
  cancel-in-progress: false

# 最小权限：只有 publish-release 需要写仓库，其余四个 job 只读即可
permissions:
  contents: read

env:
  # WeKnora go.mod 要求 go 1.26.0；wails CLI 必须与项目依赖的 wails/v2 版本一致
  # （@latest = v2.16.0 要求 go >= 1.25，且可能引入不兼容变更）
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DUCKDB_VERSION: "v1.5.2"
  WAILS_CLI_VERSION: "v2.12.0"
  # 滚动发布的固定标签：便携版每次都覆盖到同一个 Release，下载链接保持稳定。
  # 刻意不用 v* 前缀 —— 否则 gh release create 建出的标签会命中本工作流的
  # push: tags: ['v*.*.*'] 触发器，自己把自己再跑一轮。
  PORTABLE_RELEASE_TAG: "portable-latest"

jobs:
  # ── 1. 前端构建（独立 job，产物供桌面构建复用）──
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
          # 当前 frontend/dist/ 里没有 dotfile，但 Vite 会原样拷贝 public/，
          # 而 public/ 出现 .nojekyll / .well-known 之类只是时间问题 —— 静默
          # 丢文件正是上一轮踩过的坑，这里一并打开。
          include-hidden-files: true

  # ── 2. Windows 桌面应用构建 ──
  build-desktop:
    needs: build-frontend
    runs-on: windows-latest
    # 实测约 20 分钟；给足余量，但别让卡死的 wails build 白烧六小时
    timeout-minutes: 60
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_CLI_VERSION }}

      - name: Install SQLite dev headers (Windows)
        # sqlite-vec-go-bindings/cgo uses #include "sqlite3.h" with -DSQLITE_CORE.
        # The header is NOT bundled in the sqlite-vec module, nor provided by
        # mattn/go-sqlite3 (which uses a renamed sqlite3-binding.h). So we must
        # supply sqlite3.h ourselves.
        # Download the amalgamation to a space-free path (CGO splits CFLAGS on
        # spaces). The amalgamation has sqlite3.h at its ROOT, not in include/.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/sqlite
          # --retry：sqlite.org 偶尔抽风，一次 5xx 不该让整轮构建白跑
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            -o /c/sqlite/amalgamation.zip "https://www.sqlite.org/2025/sqlite-amalgamation-3500100.zip"
          unzip -o /c/sqlite/amalgamation.zip -d /c/sqlite/
          mv /c/sqlite/sqlite-amalgamation-3500100/* /c/sqlite/ 2>/dev/null || true
          ls /c/sqlite/sqlite3.h /c/sqlite/sqlite3ext.h

      - name: Pre-compile Go packages (warm cache)
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/sqlite"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app (wails build)
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/sqlite"

          # wails build runs the bindings generator, which imports internal/types
          # and therefore executes its init() -> newJieba(). With JIEBA_DICT_DIR
          # unset, gojieba falls back to the module-cache dictionary paths baked
          # into the package at build time and dies with Exception 0xc0000005
          # (access violation) on the runner. Point it at the dictionaries that
          # ship inside the gojieba module instead.
          go mod download github.com/yanyiwu/gojieba
          export JIEBA_DICT_DIR="$(go list -m -f '{{.Dir}}' github.com/yanyiwu/gojieba)/deps/cppjieba/dict"
          echo "JIEBA_DICT_DIR=${JIEBA_DICT_DIR}"

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          # -skipbindings is required on Windows: wails' bindings step builds and
          # RUNS a temporary wailsbindings.exe that imports the app packages, which
          # executes internal/types.init() -> newJieba() -> gojieba C code. That
          # aborts with Exception 0xc0000005 (access violation) on the runner.
          # The generated bindings are already committed under
          # frontend/src/wailsjs and the frontend calls window.go.main.App.*
          # directly (it never imports the generated JS wrappers), so skipping
          # regeneration changes nothing at runtime.
          # -o 会被原样传给 `go build -o <绝对路径>`，且永不补 .exe：
          # wails 只在 -o 为空时才加后缀（pkg/commands/build/base.go:123-151），
          # go 自身同理（cmd/go/internal/work/build.go:473-543，显式 -o 走
          # p.Target = cfg.BuildO，不追加 ExeSuffix）。启动器约定的是
          # %PORTABLE_ROOT%\WeKnora-Lite.exe，所以这里必须显式带上 .exe，
          # 否则产物是无后缀的 `WeKnora-Lite`，下游 find '*.exe' 会落空。
          wails build -clean \
            -skipbindings \
            -tags "desktop,sqlite_fts5" \
            -platform windows/amd64 \
            -ldflags="${LDFLAGS}" \
            -o WeKnora-Lite.exe

      - name: Locate built exe
        shell: bash
        run: |
          # wails build 输出到 cmd/desktop/build/bin/
          # 先按精确名找，再容忍无后缀/其它 .exe，避免命名差异再次整体失败。
          EXE="$(find cmd/desktop/build/bin -maxdepth 1 -type f \
                   \( -name 'WeKnora-Lite.exe' -o -name 'WeKnora-Lite' -o -name '*.exe' \) \
                   ! -name '*installer*' | head -1)"
          if [ -z "$EXE" ]; then
            echo "::error::No exe found in cmd/desktop/build/bin"
            ls -la cmd/desktop/build/bin || true
            exit 1
          fi
          echo "found: $EXE"
          cp "$EXE" WeKnora-Lite.exe
          ls -la WeKnora-Lite.exe

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> 直接把 exe 当产物上传，不再被套一层 zip（从 Actions
          # 页面下载即得原始 exe）。实测：不写 name 时产物名取文件名，因此下载端
          # 用的 name 正是 WeKnora-Lite.exe（run 日志里 "Downloading single
          # artifact ... WeKnora-Lite.exe" 可证）。两处字符串必须一致。
          path: WeKnora-Lite.exe
          archive: false
          retention-days: 1

  # ── 3. 下载 DuckDB 扩展（独立 job，缓存复用）──
  fetch-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download spatial + excel extensions
        run: |
          mkdir -p duckdb-home/extensions/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw
          cd duckdb-home/extensions/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw

          BASE="https://extensions.duckdb.org/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw"
          for EXT in spatial excel; do
            echo "Downloading ${EXT}..."
            # 扩展以 gzip 格式分发（直接 .duckdb_extension URL 返回 404）
            # --retry：extensions.duckdb.org 偶发 5xx，重试比整轮重跑便宜
            curl -fSL --retry 3 --retry-delay 5 --retry-connrefused \
              -o "${EXT}.duckdb_extension.gz" "${BASE}/${EXT}.duckdb_extension.gz"
            gunzip -f "${EXT}.duckdb_extension.gz"
          done

          # 不再下载 *.duckdb_extension.info：实测该 URL 在 extensions.duckdb.org
          # 返回 HTTP 404，1.5.x 的扩展元数据已内嵌在 .duckdb_extension 二进制里。
          ls -la

          # upload-artifact roots an uploaded directory at the least common
          # ancestor of the matched files, so `path: duckdb-home/` would NOT
          # keep the duckdb-home/extensions/<ver>/windows_amd64_mingw/ layout
          # (both files live in the same leaf dir, so the prefix is dropped).
          # The launcher sets WEKNORA_DUCKDB_EXTENSION_DIR to
          # %PORTABLE_ROOT%\duckdb-home\extensions and the app turns it into
          # `SET extension_directory = ...`, so the layout must be exact.
          cd "${GITHUB_WORKSPACE}"
          tar czf duckdb-extensions.tar.gz duckdb-home
          tar tzf duckdb-extensions.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> 直接上传 tar.gz 本身（单文件），不再被套一层 zip；
          # 下载方拿到的是原始 tar.gz，解包后目录结构不变。同样地，不写 name 时
          # 产物名取文件名，下载端的 name 正是 duckdb-extensions.tar.gz。
          path: duckdb-extensions.tar.gz
          archive: false
          retention-days: 1

  # ── 4. 便携打包（合并 exe + 前端 + 扩展 + 启动器）──
  package-portable:
    needs: [build-desktop, fetch-extensions]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # merge-multiple: true 让产物直接落在目标目录下；默认的 false 在某些产物形态
      # 下会再套一层以产物名命名的目录。紧跟其后的归一化步骤与它互为保险 —— 后面的
      # 组装步骤依赖 dist/WeKnora-Lite.exe 这个名字。
      - uses: actions/download-artifact@v8
        with:
          name: WeKnora-Lite.exe
          path: dist/
          merge-multiple: true

      # The portable package must ship the SPA: the backend serves it from
      # ./web (internal/router/static.go), and the assembly below copies
      # ../web into dist/. That directory only exists once the frontend-dist
      # artifact is downloaded, so fetch it here as build-desktop does.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: duckdb-extensions.tar.gz
          path: exts/
          merge-multiple: true

      - name: Normalize downloaded artifacts
        run: |
          # 不假设 download-artifact 的落点：把 exe 与 tar.gz 都定位出来并归位到
          # 后面几步依赖的路径上。run 37931473095 里 publish-release 就死在
          # 「假设产物落在根下」，同一个假设这里也有一份。
          # 先建目录再 find：万一下载根本没建出 dist/ 或 exts/，下面的 find 会
          # 非零退出（配合 -e 直接失败），反而走不到真正的救援逻辑。
          mkdir -p dist exts
          echo "=== what the downloads actually produced ==="
          find dist exts -maxdepth 2 -printf '%y %10s  %p\n' | sort -k3

          if [ ! -f dist/WeKnora-Lite.exe ]; then
            # 先找 dist/，再退到整个工作区 —— 产物有可能根本没落在 path 下
            src="$(find dist -type f -name 'WeKnora-Lite.exe' | head -1)"
            [ -n "$src" ] || src="$(find dist -type f -name '*.exe' | head -1)"
            [ -n "$src" ] || src="$(find . -path ./.git -prune -o -type f -name 'WeKnora-Lite.exe' -print | head -1)"
            [ -n "$src" ] || src="$(find . -path ./.git -prune -o -type f -name '*.exe' -print | head -1)"
            if [ -z "$src" ]; then
              echo "::error::desktop exe not found under dist/ nor anywhere in the workspace"
              exit 1
            fi
            echo "relocating $src -> dist/WeKnora-Lite.exe"
            cp -f "$src" dist/.exe.tmp
            rm -rf dist/WeKnora-Lite.exe      # 可能是同名目录
            mv -f dist/.exe.tmp dist/WeKnora-Lite.exe
          fi

          if [ ! -f exts/duckdb-extensions.tar.gz ]; then
            src="$(find exts -type f -name 'duckdb-extensions.tar.gz' | head -1)"
            [ -n "$src" ] || src="$(find exts -type f -name '*.tar.gz' | head -1)"
            [ -n "$src" ] || src="$(find . -path ./.git -prune -o -type f -name 'duckdb-extensions.tar.gz' -print | head -1)"
            [ -n "$src" ] || src="$(find . -path ./.git -prune -o -type f -name '*.tar.gz' -print | head -1)"
            if [ -z "$src" ]; then
              echo "::error::duckdb extensions archive not found under exts/ nor anywhere in the workspace"
              exit 1
            fi
            echo "relocating $src -> exts/duckdb-extensions.tar.gz"
            cp -f "$src" exts/.tgz.tmp
            rm -rf exts/duckdb-extensions.tar.gz
            mv -f exts/.tgz.tmp exts/duckdb-extensions.tar.gz
          fi

          ls -la dist/WeKnora-Lite.exe exts/duckdb-extensions.tar.gz

      - name: Unpack DuckDB extensions
        run: tar xzf exts/duckdb-extensions.tar.gz -C dist/

      - name: Download gojieba module (for jieba-dict extraction)
        run: go mod download github.com/yanyiwu/gojieba

      - name: Smoke-test the merged container (no GUI)
        # 前面所有步骤只保证「能编出来、能打出来」，保证不了「跑得起来」：上游
        # 合并一旦破坏运行时（迁移失败、DI 装配失败），构建照样全绿、包照样发出去，
        # 用户解压双击才发现。cmd/diag 正是为此写的 —— 它装配与桌面版相同的依赖图，
        # 在路由构造后停下，不碰 wails、不开窗口。这里在 Linux 上真跑一遍。
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libsqlite3-dev
          fi

          # gojieba 在 init 期构造，缺词典会 panic，路径必须显式给
          export JIEBA_DICT_DIR="$(go list -m -f '{{.Dir}}' github.com/yanyiwu/gojieba)/deps/cppjieba/dict"
          CGO_ENABLED=1 CGO_CFLAGS="-Wno-deprecated-declarations" \
            go build -tags sqlite_fts5 -o /tmp/weknora-diag ./cmd/diag/

          # 每次都从干净的目录开始：迁移断言依赖「从零迁到最新」这条日志，
          # 复用旧库会让第二次运行误报「migrations did not run」。
          rm -rf /tmp/weknora-smoke
          mkdir -p /tmp/weknora-smoke/files
          set +e
          DB_DRIVER=sqlite DB_PATH=/tmp/weknora-smoke/weknora.db \
          RETRIEVE_DRIVER=sqlite STORAGE_TYPE=local \
          LOCAL_STORAGE_BASE_DIR=/tmp/weknora-smoke/files \
          STREAM_MANAGER_TYPE=memory GIN_MODE=release EDITION=lite \
            timeout 300 /tmp/weknora-diag > /tmp/weknora-smoke/diag.log 2>&1
          rc=$?
          set -e
          echo "--- diag log head ---"
          head -8 /tmp/weknora-smoke/diag.log
          echo "--- diag log tail ---"
          tail -20 /tmp/weknora-smoke/diag.log

          [ "$rc" -eq 0 ] || { echo "::error::cmd/diag exited $rc - the container crashes at startup"; exit 1; }
          grep -q 'ALL GOOD' /tmp/weknora-smoke/diag.log ||
            { echo "::error::diag did not report 'ALL GOOD'"; exit 1; }
          grep -q 'Database migrated from version' /tmp/weknora-smoke/diag.log ||
            { echo "::error::migrations did not run"; exit 1; }
          test -s /tmp/weknora-smoke/weknora.db ||
            { echo "::error::sqlite database was not created"; exit 1; }
          # cmd/diag 现在与 cmd/desktop 一样把进程标记为 Lite；router.go 只在
          # Edition == "lite" 时才注册 SPA 处理器，所以这一行同时证明了 Lite 分支
          # 真的走到了 —— 而不是偷偷跑了 standard 配置。
          grep -q 'edition=lite' /tmp/weknora-smoke/diag.log ||
            { echo "::error::diag did not run in Lite mode"; exit 1; }
          # 前端已在前面下载到 web/；若在，SPA 处理器就必须注册成功
          if [ -f web/index.html ]; then
            grep -q 'Serving frontend static files' /tmp/weknora-smoke/diag.log ||
              { echo "::error::web/index.html exists but the Lite SPA handler did not register"; exit 1; }
          else
            echo "::warning::web/index.html absent - skipping the SPA handler assertion"
          fi
          echo "container smoke test passed"

      # 合规：仓库把第三方许可当作发布门禁（scripts/check-license-bundle.sh），
      # 上游 release-lite.yml 对每一个产物都调用 copy-licenses.sh，产出
      # LICENSE + THIRD_PARTY_NOTICES.md + licenses/（含 MPL-2.0 的对应源码 zip）。
      # 便携包同样是再分发产物，必须带上这份 bundle，否则只发布二进制而缺少
      # 许可与对应源码。copy-licenses.sh 内部会再跑一次校验，校验不过即失败。
      - name: Copy license notices + corresponding source
        run: bash ./scripts/copy-licenses.sh dist

      - name: Assemble portable package
        run: |
          cd dist

          # 目录布局（与 Start-Portable.bat 约定一致）
          mkdir -p data/files config-user logs
          cp -r ../web .
          cp -r ../config .
          cp -r ../migrations .
          # 这里刻意不从仓库根复制 .env：便携包永远以 .env.lite.example 为准
          # （仓库根本来也没有 .env，见下面的说明）。

          # jieba 词典：仓库不含，从 gojieba 模块缓存提取
          # gojieba 把模块缓存路径编译进二进制，跨平台构建必须用 JIEBA_DICT_DIR 重定向
          GOJIEBA_VERSION=$(grep "yanyiwu/gojieba" ../go.mod | awk '{print $2}')
          GOJIEBA="$(go env GOMODCACHE)/github.com/yanyiwu/gojieba@${GOJIEBA_VERSION}/deps/cppjieba"
          # gojieba.NewJieba 对任一缺失词典直接 panic，而 internal/types/evaluation.go:13
          # 是包级 var（init 期就构造），所以这里必须硬校验：否则打包会"成功"，
          # 用户一启动就崩。5 个文件一个都不能少。
          if [ ! -d "$GOJIEBA" ]; then
            echo "::error::gojieba module cache not found at $GOJIEBA"
            exit 1
          fi
          mkdir -p jieba-dict
          for f in jieba.dict.utf8 hmm_model.utf8 idf.utf8 stop_words.utf8 user.dict.utf8; do
            cp "$GOJIEBA/dict/$f" jieba-dict/ || { echo "::error::missing jieba dict file: $f"; exit 1; }
          done
          echo "jieba-dict: $(ls jieba-dict | wc -l) files (gojieba ${GOJIEBA_VERSION})"

          # 启动器模板：ASCII、无 BOM、CRLF，直接复制。
          # cmd.exe 需要 CRLF；若带 UTF-8 BOM，第一行会变成 BOM+@echo off 而失效，
          # 所以模板刻意保持无 BOM（见模板 :8 的说明）。
          cp ../scripts/Start-Portable.bat.template Start-Portable.bat

          # 上游桌面产物会把 .env.lite.example 落成 .env（见 release-lite.yml
          # macOS 分支的 "${RESOURCES}/.env"）。cmd/desktop/main.go:216 会
          # godotenv.Load()，而 godotenv 不覆写已存在的环境变量，所以启动器
          # 显式设置的绝对路径（DB_PATH / LOCAL_STORAGE_BASE_DIR）仍然生效，
          # 便携性不受影响；.env 只负责补上启动器没设的默认值。
          cp ../.env.lite.example .env.lite.example
          cp ../.env.lite.example .env

          # 上游把 docs/LITE.md 作为 README 一并发布
          cp ../docs/LITE.md README.md

          echo "=== Portable layout ==="
          find . -maxdepth 2 -type d | sort

      - name: Verify portable layout
        working-directory: dist
        run: |
          # 打包前先验一遍便携包结构。这里失败远好于用户解压、双击
          # Start-Portable.bat 才发现 exe 不在根目录 —— package-portable 是
          # 全绿也说明不了包是对的，只有断言才能。
          fail=0
          need_file() {
            local p="$1" min="${2:-0}" sz=0
            if [ ! -f "$p" ]; then echo "::error::missing file: dist/$p"; fail=1; return; fi
            sz=$(stat -c%s "$p")
            if [ "$sz" -lt "$min" ]; then
              echo "::error::dist/$p is only $sz bytes (expected >= $min)"; fail=1; return
            fi
            echo "ok   file  $p  ($sz B)"
          }
          need_dir() {
            local p="$1" n=0
            if [ ! -d "$p" ]; then echo "::error::missing dir: dist/$p"; fail=1; return; fi
            n=$(find "$p" -type f | wc -l)
            if [ "$n" -eq 0 ]; then echo "::error::empty dir: dist/$p"; fail=1; return; fi
            echo "ok   dir   $p  ($n files)"
          }

          # exe 必须是文件而不是同名目录：archive: false 的产物若被解成目录就会这样
          if [ -d WeKnora-Lite.exe ]; then
            echo "::error::dist/WeKnora-Lite.exe is a DIRECTORY - download-artifact nested it"
            fail=1
          fi
          need_file WeKnora-Lite.exe 50000000
          need_file Start-Portable.bat
          need_file .env
          need_file README.md
          need_file LICENSE
          need_file THIRD_PARTY_NOTICES.md
          # SPA 入口单独断言：只查 web/ 非空的话，前端被套进子目录同样能过，
          # 而那样 internal/router/static.go 会找不到 index.html
          need_file web/index.html
          need_file config/config.yaml
          need_dir web
          need_dir config
          need_dir migrations/sqlite          # 应用按 file://migrations/sqlite 跑迁移
          need_dir jieba-dict
          need_dir licenses
          need_dir licenses/sources

          jieba_n=$(find jieba-dict -type f | wc -l)
          [ "$jieba_n" -eq 5 ] || { echo "::error::jieba-dict should hold 5 files, got $jieba_n"; fail=1; }

          # DuckDB 扩展：数量与平台目录都要对 —— MinGW 构建只会去
          # windows_amd64_mingw 下找，落到 windows_amd64 等于没装
          ext_files=$(find duckdb-home/extensions -type f -name '*.duckdb_extension')
          ext_n=$(find duckdb-home/extensions -type f -name '*.duckdb_extension' | wc -l)
          printf '%s\n' "$ext_files" | sed 's/^/     ext: /'
          if [ "$ext_n" -lt 2 ]; then
            echo "::error::expected 2 duckdb extensions, found $ext_n"; fail=1
          fi
          printf '%s\n' "$ext_files" | grep -q 'windows_amd64_mingw' ||
            { echo "::error::duckdb extensions are not under windows_amd64_mingw"; fail=1; }

          # MPL 模块的对应源码 zip 属于许可合规要求，必须在包里
          src_n=$(find licenses/sources -type f -name '*.zip' | wc -l)
          [ "$src_n" -ge 1 ] ||
            { echo "::error::licenses/sources holds no corresponding-source zip"; fail=1; }

          # 启动器必须 ASCII + CRLF：带 BOM 第一行会失效，LF 会被 cmd.exe 误读
          ft=$(file -b Start-Portable.bat)
          echo "Start-Portable.bat: $ft"
          case "$ft" in *CRLF*) ;; *) echo "::error::Start-Portable.bat lost its CRLF line endings"; fail=1 ;; esac
          case "$ft" in *ASCII*) ;; *) echo "::error::Start-Portable.bat is not ASCII (BOM or non-ASCII byte)"; fail=1 ;; esac

          if [ "$fail" -ne 0 ]; then
            echo "=== dist tree (maxdepth 3) ==="
            find . -maxdepth 3 -printf '%y %10s  %p\n' | sort -k3 | head -60
            exit 1
          fi
          echo "portable layout verified"

      # 不再在这里自建 zip。download-artifact 会把「文件名以 .zip 结尾」的产物
      # 当成压缩包直接解掉 —— 即使上传时用的是 archive: false。于是 publish-release
      # 拿到的是「便携包的内容」而不是一个 zip 文件，两次构建都死在这里。
      # 改为上传目录本身，zip 统一在 publish-release 里现打（那里才真正需要它）。
      - uses: actions/upload-artifact@v7
        with:
          name: portable-dist
          path: dist/
          retention-days: 14
          # 必须显式打开：upload-artifact 的 include-hidden-files 默认是 false，
          # 会**静默丢弃** dist/ 里的 dotfile —— 也就是 .env 和 .env.lite.example。
          # 两者都是便携包的一部分（启动器与 cmd/desktop/main.go:216 的
          # godotenv.Load() 都依赖 .env），而产物上传是「成功」的，只有
          # publish-release 的断言能发现。这个默认值已害我们白跑一轮。
          include-hidden-files: true

  # ── 5. 发布到固定的 Release（每次覆盖，下载链接长期稳定）──
  # 便携版是滚动产物：标签固定、资产名固定，所以 URL 永远有效。
  # 已存在就 --clobber 覆盖；不存在就创建（--target 钉到本次构建的 commit，
  # 否则 gh 会拿默认分支当目标）。
  publish-release:
    needs: [build-desktop, package-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 唯一需要写权限的 job（gh release create/upload/delete-asset）
    permissions:
      contents: write
    steps:
      # 只为了读仓库根的 VERSION 文件（写进 Release 说明），不做构建
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 便携包以「目录」形式上产（name: portable-dist），所以这里拿到的是它的内容。
      # 关键教训：download-artifact 会把**名字以 .zip 结尾**的产物直接解包，即使
      # 上传时用的是 archive: false —— 前两次失败都源于此，与落点无关。zip 因此
      # 在这里现打，因为只有这里真正需要它。
      # merge-multiple: true 让产物内容直接落在 release-assets/ 根下。
      - uses: actions/download-artifact@v8
        with:
          name: portable-dist
          path: release-assets/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: WeKnora-Lite.exe
          path: release-assets/
          merge-multiple: true

      - name: Build release assets (zip + checksum)
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zip
          fi

          echo "=== release-assets (top level) ==="
          ls -la release-assets/ | head -40

          # 先确认下载下来的确实是完整的便携包，再花时间去 zip 138MB。
          # 缺的若是点开头的文件，八成是上传/下载对 dotfile 的坑：upload-artifact
          # 的 include-hidden-files 默认为 false，会静默丢弃 .env，产物本身却是
          # 「上传成功」。把这条线索直接写进报错里，省得下次再隔空猜一轮。
          for rel in WeKnora-Lite.exe web/index.html config/config.yaml \
                     migrations/sqlite/000000_init.up.sql Start-Portable.bat .env; do
            if [ ! -e "release-assets/$rel" ]; then
              hint=""
              case "$(basename "$rel")" in
                .*) hint=" (hidden file - check include-hidden-files: true on the upload step)" ;;
              esac
              echo "::error::release-assets/$rel is missing - the portable-dist artifact is incomplete${hint}"
              find release-assets -maxdepth 2 -printf '%y %10s  %p\n' | sort -k3 | head -40
              exit 1
            fi
          done

          # 产物名固定、不带版本号：Release 资产名不变，gh release upload --clobber
          # 才能真正覆盖旧文件，下载链接才能长期稳定。
          ARCHIVE="WeKnora-Lite-portable_windows_amd64"
          # zip 建在工作区根，避免把自己也打进去；. 保证隐藏文件（.env）也被收进去
          ( cd release-assets && zip -r "../${ARCHIVE}.zip" . )
          ls -la "${ARCHIVE}.zip"

          # 校验文件里写裸文件名：用户把 zip 与 .sha256 放同一目录后 sha256sum -c 可直接用
          HASH="$(sha256sum "${ARCHIVE}.zip" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "${ARCHIVE}.zip" > "release-assets/${ARCHIVE}.zip.sha256"
          mv -f "${ARCHIVE}.zip" release-assets/

          echo "=== assets ready ==="
          ls -la release-assets/*.zip release-assets/*.sha256 release-assets/WeKnora-Lite.exe

      - name: Publish (create or overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DEFAULT_TAG: ${{ env.PORTABLE_RELEASE_TAG }}
        run: |
          TAG="${RELEASE_TAG_INPUT:-$DEFAULT_TAG}"

          # 防呆：v*.*.* 形式的标签会命中本工作流的 push 触发器，自己跑自己
          case "$TAG" in
            v*.*.*)
              echo "::error::tag '$TAG' matches the 'v*.*.*' push trigger and would re-trigger this workflow"
              exit 1
              ;;
          esac

          APP_VERSION="$(cat VERSION 2>/dev/null || echo unknown)"
          TITLE="WeKnora Lite Portable (Windows x64)"
          NOTES="Windows 便携版（滚动构建，每次覆盖本 Release）
          - 应用版本: ${APP_VERSION}
          - commit: ${GITHUB_SHA}
          - 构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - 触发方式: ${GITHUB_EVENT_NAME}

          解压后双击 Start-Portable.bat 运行；数据、密钥、DuckDB 扩展全部写入该目录，不碰用户目录。"

          echo "=== assets to publish ==="
          # 显式列出三个资产。这里绝不能用 `find release-assets -type f` ——
          # release-assets/ 现在装着整个便携包的内容（config/ migrations/ web/ …），
          # 那样会把几百个文件都当成 Release 资产。
          ASSETS=(
            release-assets/WeKnora-Lite-portable_windows_amd64.zip
            release-assets/WeKnora-Lite-portable_windows_amd64.zip.sha256
            release-assets/WeKnora-Lite.exe
          )
          for f in "${ASSETS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f"
              ls -la release-assets/ | head -30
              exit 1
            fi
            ls -la "$f"
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' exists -> overwriting"
            # 清掉不属于本次的文件（例如改名前留下的旧资产），保证 Release 内容干净
            gh release view "$TAG" --json assets -q '.assets[].name' > /tmp/assets.txt
            while read -r name; do
              if [ -n "$name" ]; then
                case " WeKnora-Lite-portable_windows_amd64.zip WeKnora-Lite-portable_windows_amd64.zip.sha256 WeKnora-Lite.exe " in
                  *" $name "*) ;;
                  *) echo "removing stale asset: $name"; gh release delete-asset "$TAG" "$name" --yes || true ;;
                esac
              fi
            done < /tmp/assets.txt
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            # 走到这里有两种可能：Release 确实不存在（正常，走创建），或者 API
            # 出错（token 权限不足 / 网络）。把 gh 的原文打出来，否则接下来
            # create 的报错会掩盖真因。
            echo "gh release view '$TAG' did not succeed; raw error follows:"
            gh release view "$TAG" 2>&1 | sed 's/^/    /' || true
            echo "release '$TAG' does not exist -> creating at $GITHUB_SHA"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" "${ASSETS[@]}"
          fi

          echo "=== final release state ==="
          gh release view "$TAG"
