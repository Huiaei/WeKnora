name: Build Windows Portable

# WeKnora Lite — Windows 便携版构建
# 参考上游 release-lite.yml 结构，但产物为便携目录而非 NSIS 安装包。
# 核心差异：
#   - wails build 自动处理 desktop+production 标签、图标、资源
#   - 产物 = WeKnora-Lite.exe + web/ + config/ + migrations/ + jieba-dict/
#     + duckdb 扩展捆绑 + Start-Portable.bat 启动器
#   - 扩展从 extensions.duckdb.org 下载（gzip 格式），离线可用

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到哪个 Release 标签（留空 = portable-latest，每次覆盖同一个 Release）'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  # WeKnora go.mod 要求 go 1.26.0；wails CLI 必须与项目依赖的 wails/v2 版本一致
  # （@latest = v2.16.0 要求 go >= 1.25，且可能引入不兼容变更）
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DUCKDB_VERSION: "v1.5.2"
  WAILS_CLI_VERSION: "v2.12.0"
  # 滚动发布的固定标签：便携版每次都覆盖到同一个 Release，下载链接保持稳定。
  # 刻意不用 v* 前缀 —— 否则 gh release create 建出的标签会命中本工作流的
  # push: tags: ['v*.*.*'] 触发器，自己把自己再跑一轮。
  PORTABLE_RELEASE_TAG: "portable-latest"

jobs:
  # ── 1. 前端构建（独立 job，产物供桌面构建复用）──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2. Windows 桌面应用构建 ──
  build-desktop:
    needs: build-frontend
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_CLI_VERSION }}

      - name: Install SQLite dev headers (Windows)
        # sqlite-vec-go-bindings/cgo uses #include "sqlite3.h" with -DSQLITE_CORE.
        # The header is NOT bundled in the sqlite-vec module, nor provided by
        # mattn/go-sqlite3 (which uses a renamed sqlite3-binding.h). So we must
        # supply sqlite3.h ourselves.
        # Download the amalgamation to a space-free path (CGO splits CFLAGS on
        # spaces). The amalgamation has sqlite3.h at its ROOT, not in include/.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/sqlite
          curl -fsSL -o /c/sqlite/amalgamation.zip "https://www.sqlite.org/2025/sqlite-amalgamation-3500100.zip"
          unzip -o /c/sqlite/amalgamation.zip -d /c/sqlite/
          mv /c/sqlite/sqlite-amalgamation-3500100/* /c/sqlite/ 2>/dev/null || true
          ls /c/sqlite/sqlite3.h /c/sqlite/sqlite3ext.h

      - name: Pre-compile Go packages (warm cache)
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/sqlite"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app (wails build)
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/sqlite"

          # wails build runs the bindings generator, which imports internal/types
          # and therefore executes its init() -> newJieba(). With JIEBA_DICT_DIR
          # unset, gojieba falls back to the module-cache dictionary paths baked
          # into the package at build time and dies with Exception 0xc0000005
          # (access violation) on the runner. Point it at the dictionaries that
          # ship inside the gojieba module instead.
          go mod download github.com/yanyiwu/gojieba
          export JIEBA_DICT_DIR="$(go list -m -f '{{.Dir}}' github.com/yanyiwu/gojieba)/deps/cppjieba/dict"
          echo "JIEBA_DICT_DIR=${JIEBA_DICT_DIR}"

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          # -skipbindings is required on Windows: wails' bindings step builds and
          # RUNS a temporary wailsbindings.exe that imports the app packages, which
          # executes internal/types.init() -> newJieba() -> gojieba C code. That
          # aborts with Exception 0xc0000005 (access violation) on the runner.
          # The generated bindings are already committed under
          # frontend/src/wailsjs and the frontend calls window.go.main.App.*
          # directly (it never imports the generated JS wrappers), so skipping
          # regeneration changes nothing at runtime.
          # -o 会被原样传给 `go build -o <绝对路径>`，且永不补 .exe：
          # wails 只在 -o 为空时才加后缀（pkg/commands/build/base.go:123-151），
          # go 自身同理（cmd/go/internal/work/build.go:473-543，显式 -o 走
          # p.Target = cfg.BuildO，不追加 ExeSuffix）。启动器约定的是
          # %PORTABLE_ROOT%\WeKnora-Lite.exe，所以这里必须显式带上 .exe，
          # 否则产物是无后缀的 `WeKnora-Lite`，下游 find '*.exe' 会落空。
          wails build -clean \
            -skipbindings \
            -tags "desktop,sqlite_fts5" \
            -platform windows/amd64 \
            -ldflags="${LDFLAGS}" \
            -o WeKnora-Lite.exe

      - name: Locate built exe
        shell: bash
        run: |
          # wails build 输出到 cmd/desktop/build/bin/
          # 先按精确名找，再容忍无后缀/其它 .exe，避免命名差异再次整体失败。
          EXE="$(find cmd/desktop/build/bin -maxdepth 1 -type f \
                   \( -name 'WeKnora-Lite.exe' -o -name 'WeKnora-Lite' -o -name '*.exe' \) \
                   ! -name '*installer*' | head -1)"
          if [ -z "$EXE" ]; then
            echo "::error::No exe found in cmd/desktop/build/bin"
            ls -la cmd/desktop/build/bin || true
            exit 1
          fi
          echo "found: $EXE"
          cp "$EXE" WeKnora-Lite.exe
          ls -la WeKnora-Lite.exe

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> 直接把 exe 当产物上传，不再被套一层 zip（从 Actions
          # 页面下载即得原始 exe）。此时 name 参数被忽略，产物名 = 文件名。
          path: WeKnora-Lite.exe
          archive: false
          retention-days: 1

  # ── 3. 下载 DuckDB 扩展（独立 job，缓存复用）──
  fetch-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Download spatial + excel extensions
        run: |
          mkdir -p duckdb-home/extensions/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw
          cd duckdb-home/extensions/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw

          BASE="https://extensions.duckdb.org/${{ env.DUCKDB_VERSION }}/windows_amd64_mingw"
          for EXT in spatial excel; do
            echo "Downloading ${EXT}..."
            # 扩展以 gzip 格式分发（直接 .duckdb_extension URL 返回 404）
            curl -fSL -o "${EXT}.duckdb_extension.gz" "${BASE}/${EXT}.duckdb_extension.gz"
            gunzip -f "${EXT}.duckdb_extension.gz"
          done

          # 不再下载 *.duckdb_extension.info：实测该 URL 在 extensions.duckdb.org
          # 返回 HTTP 404，1.5.x 的扩展元数据已内嵌在 .duckdb_extension 二进制里。
          ls -la

          # upload-artifact roots an uploaded directory at the least common
          # ancestor of the matched files, so `path: duckdb-home/` would NOT
          # keep the duckdb-home/extensions/<ver>/windows_amd64_mingw/ layout
          # (both files live in the same leaf dir, so the prefix is dropped).
          # The launcher sets WEKNORA_DUCKDB_EXTENSION_DIR to
          # %PORTABLE_ROOT%\duckdb-home\extensions and the app turns it into
          # `SET extension_directory = ...`, so the layout must be exact.
          cd "${GITHUB_WORKSPACE}"
          tar czf duckdb-extensions.tar.gz duckdb-home
          tar tzf duckdb-extensions.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> 直接上传 tar.gz 本身（单文件），不再被套一层 zip；
          # 下载方拿到的是原始 tar.gz，解包后目录结构不变。name 被忽略，
          # 产物名 = duckdb-extensions.tar.gz。
          path: duckdb-extensions.tar.gz
          archive: false
          retention-days: 1

  # ── 4. 便携打包（合并 exe + 前端 + 扩展 + 启动器）──
  package-portable:
    needs: [build-desktop, fetch-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: WeKnora-Lite.exe
          path: dist/

      # The portable package must ship the SPA: the backend serves it from
      # ./web (internal/router/static.go), and the assembly below copies
      # ../web into dist/. That directory only exists once the frontend-dist
      # artifact is downloaded, so fetch it here as build-desktop does.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - uses: actions/download-artifact@v8
        with:
          name: duckdb-extensions.tar.gz
          path: exts/

      - name: Unpack DuckDB extensions
        run: tar xzf exts/duckdb-extensions.tar.gz -C dist/

      - name: Download gojieba module (for jieba-dict extraction)
        run: go mod download github.com/yanyiwu/gojieba

      # 合规：仓库把第三方许可当作发布门禁（scripts/check-license-bundle.sh），
      # 上游 release-lite.yml 对每一个产物都调用 copy-licenses.sh，产出
      # LICENSE + THIRD_PARTY_NOTICES.md + licenses/（含 MPL-2.0 的对应源码 zip）。
      # 便携包同样是再分发产物，必须带上这份 bundle，否则只发布二进制而缺少
      # 许可与对应源码。copy-licenses.sh 内部会再跑一次校验，校验不过即失败。
      - name: Copy license notices + corresponding source
        run: bash ./scripts/copy-licenses.sh dist

      - name: Assemble portable package
        run: |
          cd dist

          # 目录布局（与 Start-Portable.bat 约定一致）
          mkdir -p data/files config-user logs
          cp -r ../web .
          cp -r ../config .
          cp -r ../migrations .
          if [ -f ../.env ]; then cp ../.env .; fi

          # jieba 词典：仓库不含，从 gojieba 模块缓存提取
          # gojieba 把模块缓存路径编译进二进制，跨平台构建必须用 JIEBA_DICT_DIR 重定向
          GOJIEBA_VERSION=$(grep "yanyiwu/gojieba" ../go.mod | awk '{print $2}')
          GOJIEBA="$(go env GOMODCACHE)/github.com/yanyiwu/gojieba@${GOJIEBA_VERSION}/deps/cppjieba"
          # gojieba.NewJieba 对任一缺失词典直接 panic，而 internal/types/evaluation.go:13
          # 是包级 var（init 期就构造），所以这里必须硬校验：否则打包会"成功"，
          # 用户一启动就崩。5 个文件一个都不能少。
          if [ ! -d "$GOJIEBA" ]; then
            echo "::error::gojieba module cache not found at $GOJIEBA"
            exit 1
          fi
          mkdir -p jieba-dict
          for f in jieba.dict.utf8 hmm_model.utf8 idf.utf8 stop_words.utf8 user.dict.utf8; do
            cp "$GOJIEBA/dict/$f" jieba-dict/ || { echo "::error::missing jieba dict file: $f"; exit 1; }
          done
          echo "jieba-dict: $(ls jieba-dict | wc -l) files (gojieba ${GOJIEBA_VERSION})"

          # 启动器模板：ASCII、无 BOM、CRLF，直接复制。
          # cmd.exe 需要 CRLF；若带 UTF-8 BOM，第一行会变成 BOM+@echo off 而失效，
          # 所以模板刻意保持无 BOM（见模板 :8 的说明）。
          cp ../scripts/Start-Portable.bat.template Start-Portable.bat

          # 上游桌面产物会把 .env.lite.example 落成 .env（见 release-lite.yml
          # macOS 分支的 "${RESOURCES}/.env"）。cmd/desktop/main.go:216 会
          # godotenv.Load()，而 godotenv 不覆写已存在的环境变量，所以启动器
          # 显式设置的绝对路径（DB_PATH / LOCAL_STORAGE_BASE_DIR）仍然生效，
          # 便携性不受影响；.env 只负责补上启动器没设的默认值。
          cp ../.env.lite.example .env.lite.example
          cp ../.env.lite.example .env

          # 上游把 docs/LITE.md 作为 README 一并发布
          cp ../docs/LITE.md README.md

          echo "=== Portable layout ==="
          find . -maxdepth 2 -type d | sort

      - name: Package archive
        run: |
          # ubuntu-latest 预装 zip；显式兜底，避免镜像变动让整轮构建白跑
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zip
          fi

          # 产物名固定、不带版本号：Release 资产名不变，gh release upload
          # --clobber 才能真正覆盖旧文件，下载链接才能长期稳定。
          # 版本信息嵌在 exe 的 LDFlags 里（Version / Edition / CommitID /
          # BuildTime，由 scripts/get_version.sh 从仓库根的 VERSION 文件算出）。
          ARCHIVE="WeKnora-Lite-portable_windows_amd64"
          cd dist
          zip -r "../${ARCHIVE}.zip" .
          cd ..
          # 这里只打印校验值供日志核对；Release 上的 .sha256 在 publish-release
          # 里对「实际下载到的字节」重算，保证与 Release 文件严格对应。
          sha256sum "${ARCHIVE}.zip"
          ls -la "${ARCHIVE}.zip"

      - uses: actions/upload-artifact@v7
        with:
          # archive: false -> 产物就是那个 zip 本身。否则 upload-artifact 会再压
          # 一层，从 Actions 页面下载得到「zip 套 zip」，要解两次。name 被忽略，
          # 产物名 = WeKnora-Lite-portable_windows_amd64.zip。
          path: WeKnora-Lite-portable_windows_amd64.zip
          archive: false
          retention-days: 14

  # ── 5. 发布到固定的 Release（每次覆盖，下载链接长期稳定）──
  # 便携版是滚动产物：标签固定、资产名固定，所以 URL 永远有效。
  # 已存在就 --clobber 覆盖；不存在就创建（--target 钉到本次构建的 commit，
  # 否则 gh 会拿默认分支当目标）。
  publish-release:
    needs: [build-desktop, package-portable]
    runs-on: ubuntu-latest
    steps:
      # 只为了读仓库根的 VERSION 文件（写进 Release 说明），不做构建
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 两个产物都是 archive: false 上传的单文件，下载后就是原始文件本身。
      # merge-multiple: true 让它们直接落在 release-assets/ 根下；默认的 false
      # 会再套一层以产物名命名的目录（release-assets/<artifact>/<file>），
      # 那样下面按文件名定位就会落空 —— run 37931473095 正是死在这里。
      - uses: actions/download-artifact@v8
        with:
          name: WeKnora-Lite-portable_windows_amd64.zip
          path: release-assets/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: WeKnora-Lite.exe
          path: release-assets/
          merge-multiple: true

      - name: Collect assets + compute checksum
        run: |
          # 不猜 download-artifact 把文件放在哪：archive: false 的单文件产物并没有把
          # path 语义写进文档，merge-multiple 默认 false 又可能套一层以产物名命名的
          # 目录。run 37931473095 就是死在「假设它落在 release-assets/ 根下」。
          # 这里先全盘定位两个产物、统一收进 release-assets/，并把真实布局打出来。
          mkdir -p release-assets
          echo "=== workspace top level (maxdepth 2) ==="
          find . -maxdepth 2 -path ./.git -prune -o -type f -printf '%10s  %p\n' | sort -k2 | head -30

          collect() {   # $1 = 期望文件名, $2 = 兜底通配
            local want="$1" glob="$2" src=""
            if [ -f "release-assets/$want" ]; then
              echo "in place : $want"
              return 0
            fi
            src="$(find . -path ./.git -prune -o -type f -name "$want" -print | head -1)"
            [ -n "$src" ] || src="$(find . -path ./.git -prune -o -type f -name "$glob" -print | head -1)"
            if [ -z "$src" ]; then
              echo "::warning::could not locate $want anywhere in the workspace"
              return 0
            fi
            echo "collected: $src -> release-assets/$want"
            # 先搬到临时名：src 有可能就在 release-assets/<want>/ 里面，
            # 直接 rm -rf 那个目录会把源文件一起删掉。
            cp -f "$src" "release-assets/.collect.tmp"
            rm -rf "release-assets/$want"     # 可能是同名目录（产物被解成了目录）
            mv -f "release-assets/.collect.tmp" "release-assets/$want"
          }
          collect 'WeKnora-Lite-portable_windows_amd64.zip' '*portable*.zip'
          collect 'WeKnora-Lite.exe' '*.exe'

          # 收尾：release-assets/ 只留两个规范文件。清掉「套了一层产物名目录」的残留
          # 与被重命名的副本，否则 find 收集资产时会把它们也当成第 4、第 5 个资产。
          find release-assets -mindepth 1 -maxdepth 1 \
            ! -name 'WeKnora-Lite-portable_windows_amd64.zip' \
            ! -name 'WeKnora-Lite.exe' -print0 |
            while IFS= read -r -d '' stray; do
              echo "cleaning stray entry: $stray"
              rm -rf "$stray"
            done

          echo "=== release-assets ==="
          ls -la release-assets/

          if [ ! -f 'release-assets/WeKnora-Lite-portable_windows_amd64.zip' ]; then
            echo "::error::portable zip missing - nothing to checksum"
            exit 1
          fi
          HASH="$(sha256sum 'release-assets/WeKnora-Lite-portable_windows_amd64.zip' | awk '{print $1}')"
          # 校验文件里写裸文件名：用户把 zip 和 .sha256 放同一目录后
          # `sha256sum -c` 就能直接用
          printf '%s  %s\n' "$HASH" 'WeKnora-Lite-portable_windows_amd64.zip' \
            > release-assets/WeKnora-Lite-portable_windows_amd64.zip.sha256
          cat release-assets/WeKnora-Lite-portable_windows_amd64.zip.sha256

      - name: Publish (create or overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DEFAULT_TAG: ${{ env.PORTABLE_RELEASE_TAG }}
        run: |
          TAG="${RELEASE_TAG_INPUT:-$DEFAULT_TAG}"

          # 防呆：v*.*.* 形式的标签会命中本工作流的 push 触发器，自己跑自己
          case "$TAG" in
            v*.*.*)
              echo "::error::tag '$TAG' matches the 'v*.*.*' push trigger and would re-trigger this workflow"
              exit 1
              ;;
          esac

          APP_VERSION="$(cat VERSION 2>/dev/null || echo unknown)"
          TITLE="WeKnora Lite Portable (Windows x64)"
          NOTES="Windows 便携版（滚动构建，每次覆盖本 Release）
          - 应用版本: ${APP_VERSION}
          - commit: ${GITHUB_SHA}
          - 构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - 触发方式: ${GITHUB_EVENT_NAME}

          解压后双击 Start-Portable.bat 运行；数据、密钥、DuckDB 扩展全部写入该目录，不碰用户目录。"

          echo "=== assets to publish ==="
          ls -la release-assets/
          # 用 find 而不是 shell 通配：artifact 解包后无论文件落在 release-assets/
          # 根下还是某个子目录里都能正确收集，且先列出清单便于排查
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::no files found under release-assets/ - nothing to publish"
            exit 1
          fi
          printf '  %s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' exists -> overwriting"
            # 清掉不属于本次的文件（例如改名前留下的旧资产），保证 Release 内容干净
            gh release view "$TAG" --json assets -q '.assets[].name' > /tmp/assets.txt
            while read -r name; do
              if [ -n "$name" ]; then
                case " WeKnora-Lite-portable_windows_amd64.zip WeKnora-Lite-portable_windows_amd64.zip.sha256 WeKnora-Lite.exe " in
                  *" $name "*) ;;
                  *) echo "removing stale asset: $name"; gh release delete-asset "$TAG" "$name" --yes || true ;;
                esac
              fi
            done < /tmp/assets.txt
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            echo "release '$TAG' does not exist -> creating at $GITHUB_SHA"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" "${ASSETS[@]}"
          fi

          echo "=== final release state ==="
          gh release view "$TAG"
